[project]
name = "python-scripts"
description = "Various Python scripts"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "icalendar==5.0.14",
    "Scrapy==2.18.0",
    "selenium==4.47.0",
    "markdownify==1.2.3",
    "requests==2.34.2",
    "feedparser==6.0.14",
    "mutagen>=1.48.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.4",
]

[tool.ruff.lint]
extend-select = ["E", "W", "I", "B", "Q"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = [
  ".", "scripts"
]
log_cli = true
log_cli_level = "DEBUG"
